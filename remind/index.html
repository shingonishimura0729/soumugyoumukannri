<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>設計リマインド</title>
<link rel="stylesheet" href="remind.css?v=2">
</head>
<body>
<header>
  <h1>📌 設計リマインド</h1>
  <div id="label">読み込み中…</div>
</header>
<main>
  <div id="login" class="center" hidden>
    <p>西村さんの会社の Google アカウントでログインしてください。</p>
    <button id="loginBtn" class="primary">Google でログイン</button>
    <p class="note">LINE WORKS の中で開いてログインできないときは、右上のメニューから「ブラウザで開く」を選んでください。</p>
  </div>
  <div id="msg"></div>
  <div id="content" hidden>
    <nav class="tabs people" id="people"></nav>
    <nav class="tabs">
      <button id="tabNew" class="tab on">新しく送る</button>
      <button id="tabList" class="tab">一覧</button>
      <button id="tabRooms" class="tab">トークルーム</button>
    </nav>

    <section id="paneNew">
      <label class="f">相手
        <select id="to"></select>
        <span class="note" id="roomNote"></span>
      </label>
      <label class="f">物件名
        <input id="property" maxlength="100" placeholder="例：〇〇邸（外構）" autocomplete="off" list="propList">
        <datalist id="propList"></datalist>
      </label>
      <div id="existing"></div>
      <div class="f">確認事項（相手が日付とひとことで答える）
        <div class="tpl" id="tpl"></div>
        <div id="checks"></div>
        <button id="addCheck" type="button">＋ 確認事項を足す</button>
      </div>
      <div class="f">やること
        <div id="todos"></div>
        <button id="addTodo" type="button">＋ やることを足す</button>
      </div>
      <label class="f">締め日（無ければ空のまま＝済になるまで毎朝知らせる）
        <span class="row"><input id="due" type="date"><button id="clearDue" type="button">空にする</button></span>
      </label>
      <div class="preview" id="preview"></div>
      <button id="send" class="primary big">設計共有LINEへ送る</button>
    </section>

    <section id="paneList" hidden>
      <div class="card quick">
        <div class="ttl" id="qTitle">かんたん入力</div>
        <input id="qProp" style="width:100%;margin:6px 0" maxlength="100" placeholder="物件名（今のカードの名前を選ぶと項目を足します）" autocomplete="off" list="qPropList">
        <datalist id="qPropList"></datalist>
        <textarea id="qChecks" style="margin-bottom:6px" rows="4" placeholder="確認事項を1行に1つ&#10;例：ｶｰﾎﾟｰﾄ完了検査"></textarea>
        <div class="tpl" id="qTpl"></div>
        <button id="qSend" class="primary">送る</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="showDone"> 済も表示</label>
      </div>
      <div id="list"></div>
    </section>

    <section id="paneRooms" hidden>
      <p class="note">リマインドを送る相手とトークルームです。トークルームIDは LINE WORKS のトークルームの「…」→「トークルーム情報」などで分かる番号です。その部屋に「アーキリマインド」を入れておいてください。部屋の名前は、PC が1〜2分で確かめて埋めます。</p>
      <div id="roomList"></div>
      <div class="card">
        <div class="ttl">トークルームを足す</div>
        <label class="f">名前（例：永井）<input id="rName" style="width:100%" maxlength="20"></label>
        <label class="f">トークルームID<input id="rId" style="width:100%" maxlength="64" autocomplete="off"></label>
        <button id="rAdd" class="primary">足す</button>
      </div>
    </section>

    <p class="note" style="margin-top:30px">ログイン中：<span id="who"></span>　<a href="#" id="logout">ログアウト</a></p>
  </div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { firebaseConfig } from "../assets/js/firebase-config.js";
import { esc, newKey, todayStr, dueLabel, isOverdue, taskUrl, TEMPLATE_CHECKS, itemHtml, newItem, allDone } from "./remind.js?v=2";

/*
 * 西村さん専用：リマインドを作って送る／一覧で未済と答えを見る。
 * 中身（物件名など）はこのファイルに書かない。守りは firestore.rules の remindTasks。
 * 実際に LINE WORKS へ送るのはPC（lw_report/remind.py）。ここでは「送る」を押すと文書を作るだけ。
 */
const $ = (id) => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let rooms = [], tasks = [], unsub = null;

/* ---------- 人ごとのページ（永井設計／野田設計…）。選んだ人は送る相手と一覧の両方に効く ---------- */
let person = "";
try { person = localStorage.getItem("remindPerson") || ""; } catch { /* 覚えられなくても動く */ }
function renderPeople() {
  if (!rooms.some((r) => r.userId === person)) person = rooms[0] ? rooms[0].userId : "";
  $("people").style.display = rooms.length < 2 ? "none" : "";   // .tabs が flex なので hidden 属性は効かない
  $("people").innerHTML = rooms.map((r) => {
    const n = tasks.filter((t) => t.toUserId === r.userId && t.status === "open").length;
    return `<button class="tab ${r.userId === person ? "on" : ""}" data-person="${esc(r.userId)}">${esc(r.name)}設計${n ? `（${n}）` : ""}</button>`;
  }).join("");
}
function setPerson(id) {
  person = id;
  try { localStorage.setItem("remindPerson", id); } catch { /* 無視 */ }
  if ($("to").value !== id) { $("to").value = id; preview(); }
  renderPeople();
  renderList();
  renderQuick();
}
$("people").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-person]");
  if (b) setPerson(b.dataset.person);
});

/* ---------- 入力 ---------- */
function addLine(boxId, ph, val = "") {
  const wrap = document.createElement("div");
  wrap.className = "line";
  wrap.innerHTML = `<input maxlength="200" placeholder="${esc(ph)}" value="${esc(val)}"><button type="button" class="x" title="消す">×</button>`;
  wrap.querySelector(".x").addEventListener("click", () => { wrap.remove(); preview(); });
  wrap.querySelector("input").addEventListener("input", preview);
  $(boxId).appendChild(wrap);
}
const lines = (boxId) => [...$(boxId).querySelectorAll("input")].map((i) => i.value.trim()).filter(Boolean);
const PH_TODO = "例：ブロック数量の拾い出し", PH_CHECK = "例：門柱の位置はお客様了承済みか";

/** 同じ相手・同じ物件のカード（あれば項目をそこへ足す） */
function existingCard() {
  const to = $("to").value, prop = $("property").value.trim();
  if (!to || !prop) return null;
  return findCard(to, prop);
}
const findCard = (to, prop) => tasks.find((t) => t.toUserId === to && t.property.trim() === prop.trim()) || null;

function preview() {
  const r = rooms.find((x) => x.userId === $("to").value);
  $("propList").innerHTML = tasks.filter((t) => r && t.toUserId === r.userId)
    .map((t) => `<option value="${esc(t.property)}"></option>`).join("");
  const todos = lines("todos"), checks = lines("checks"), due = $("due").value;
  if (!r) { $("preview").textContent = ""; $("existing").innerHTML = ""; return; }
  $("roomNote").textContent = "送り先：" + r.roomTitle;
  const ex = existingCard();
  $("existing").innerHTML = ex
    ? `<div class="addnote">この物件のカードがあります。送ると<b>同じカードに項目を足し</b>、部屋へは足した分だけ知らせます。${ex.status === "done" ? "（済のカードは未済に戻ります）" : ""}
        <div class="items">${[...(ex.checks || []), ...(ex.todos || [])].map(itemHtml).join("")}</div></div>`
    : "";
  const prop = $("property").value.trim() || "（物件名）";
  let t = ex ? `【リマインド】${r.name}さんへ（項目を追加）\n物件：${prop}\n` : `【リマインド】${r.name}さんへ\n物件：${prop}\n`;
  if (checks.length) t += "■確認事項\n" + checks.map((x) => "□" + x).join("\n") + "\n";
  if (todos.length) t += "■やること\n" + todos.map((x) => "□" + x).join("\n") + "\n";
  if (!ex || due) t += due ? `締め日：${dueLabel(due)}\n` : "締め日：なし（済になるまで毎朝お知らせ）\n";
  t += "→ 日付・ひとこと・済はボタンから";
  $("preview").textContent = "送る内容の見本（" + r.roomTitle + "）\n\n" + t;
}

$("addTodo").addEventListener("click", () => addLine("todos", PH_TODO));
$("addCheck").addEventListener("click", () => addLine("checks", PH_CHECK));
$("tpl").innerHTML = `<button type="button" id="tplAll">ひな形5つを全部入れる</button>` +
  TEMPLATE_CHECKS.map((q, i) => `<button type="button" data-tpl="${i}">＋${esc(q)}</button>`).join("");
$("tpl").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const have = new Set(lines("checks"));
  const add = b.id === "tplAll" ? TEMPLATE_CHECKS : [TEMPLATE_CHECKS[Number(b.dataset.tpl)]];
  // 空の欄は先に片づける
  for (const w of [...$("checks").querySelectorAll(".line")]) if (!w.querySelector("input").value.trim()) w.remove();
  for (const q of add) if (!have.has(q)) addLine("checks", PH_CHECK, q);
  preview();
});
$("clearDue").addEventListener("click", () => { $("due").value = ""; preview(); });
for (const id of ["to", "property", "due"]) $(id).addEventListener("input", preview);
$("to").addEventListener("change", () => setPerson($("to").value));

function resetForm() {
  $("property").value = ""; $("todos").innerHTML = ""; $("checks").innerHTML = ""; $("due").value = "";
  addLine("checks", PH_CHECK); addLine("todos", PH_TODO);
  preview();
}

/** 1件送る（同じ相手・同じ物件のカードがあれば項目を足す）。成功したら知らせの文を返す */
async function submitTask(r, property, checks, todos, due) {
  if (!r) throw new Error("相手を選んでください");
  if (!property) throw new Error("物件名を入れてください");
  if (!todos.length && !checks.length) throw new Error("確認事項かやることを1つは入れてください");
  if (due && due < todayStr()) throw new Error("締め日が過去の日付です");
  const ex = findCard(r.userId, property);
  const now = new Date().toISOString();
  if (ex) {
    const upd = {
      checks: [...(ex.checks || []), ...checks.map((q) => newItem(q, now))],
      todos: [...(ex.todos || []), ...todos.map((q) => newItem(q, now))],
      status: "open", doneAtISO: "", resend: true, updatedAtISO: now,
    };
    if (upd.checks.length > 40 || upd.todos.length > 40) throw new Error("1つの物件に入れられる項目は、それぞれ40までです");
    if (due) upd.due = due;
    await updateDoc(doc(db, "remindTasks", ex.id), upd);
    return `「${property}」のカードに ${checks.length + todos.length}項目を足しました。1〜2分で「${r.roomTitle || r.name}」に出ます。`;
  }
  await setDoc(doc(db, "remindTasks", newKey()), {
    toName: r.name, toUserId: r.userId, channelId: r.channelId, roomTitle: r.roomTitle || "",
    property, todos: todos.map((q) => newItem(q, now)), checks: checks.map((q) => newItem(q, now)),
    due, status: "open", doneAtISO: "", createdAtISO: now, updatedAtISO: now,
    sentAtISO: "", sentError: "", resend: false, dueLog: [], events: [], notified: 0,
  });
  return `${r.name}さんあてに受け付けました。1〜2分で「${r.roomTitle || r.name}」に出ます。`;
}

$("send").addEventListener("click", async () => {
  const r = rooms.find((x) => x.userId === $("to").value);
  $("send").disabled = true;
  try {
    say(await submitTask(r, $("property").value.trim(), lines("checks"), lines("todos"), $("due").value));
    resetForm();
  } catch (e) {
    say(`送れませんでした（${e.code || e.message}）`, true);
  } finally { $("send").disabled = false; }
});

/* ---------- 一覧のかんたん入力（物件名＋確認事項だけ） ---------- */
const qLines = () => [...new Set($("qChecks").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean))];
function renderQuick() {
  const r = rooms.find((x) => x.userId === person);
  $("qTitle").textContent = r ? `かんたん入力（${r.name}さんへ）` : "かんたん入力";
  $("qPropList").innerHTML = tasks.filter((t) => r && t.toUserId === r.userId)
    .map((t) => `<option value="${esc(t.property)}"></option>`).join("");
}
$("qTpl").innerHTML = TEMPLATE_CHECKS.map((q, i) => `<button type="button" data-q="${i}">＋${esc(q)}</button>`).join("");
$("qTpl").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-q]");
  if (!b) return;
  const q = TEMPLATE_CHECKS[Number(b.dataset.q)], have = qLines();
  if (!have.includes(q)) $("qChecks").value = [...have, q].join("\n");
});
$("qSend").addEventListener("click", async () => {
  const r = rooms.find((x) => x.userId === person);
  $("qSend").disabled = true;
  try {
    say(await submitTask(r, $("qProp").value.trim(), qLines(), [], ""));
    $("qProp").value = ""; $("qChecks").value = "";
  } catch (e) {
    say(`送れませんでした（${e.code || e.message}）`, true);
  } finally { $("qSend").disabled = false; }
});

/* ---------- トークルームの編集（remindRooms/main を西村さんが書く。消した部屋は removed に残し、PCの自動探しで戻さない） ---------- */
const ROOM_ID_RE = /^[A-Za-z0-9_-]{6,64}$/;
function renderRooms() {
  $("roomList").innerHTML = rooms.length ? rooms.map((r, i) => `<div class="card">
      <label class="f">名前<input data-rname="${i}" maxlength="20" value="${esc(r.name)}"></label>
      <label class="f">トークルームID<input data-rid="${i}" maxlength="64" value="${esc(r.channelId)}"></label>
      <div class="sub">部屋の名前：${r.roomTitle ? esc(r.roomTitle) : "（PCが確かめ中）"}${r.roomError ? ` <span class="tag red">${esc(r.roomError)}</span>` : ""}</div>
      <div class="row"><button data-rsave="${i}" class="primary">保存</button><button data-rdel="${i}" class="danger">削除</button></div>
    </div>`).join("") : "<p>まだ登録がありません。</p>";
}
async function saveRooms(next, removed) {
  await setDoc(doc(db, "remindRooms", "main"), { rooms: next, removed: removed.slice(-200), updatedAtISO: new Date().toISOString() }, { merge: true });
  rooms = next;
  renderPeople(); renderRooms(); renderQuick(); refreshTo(); renderList();
}
async function loadRemoved() {
  const s = await getDoc(doc(db, "remindRooms", "main"));
  return s.exists() ? (s.data().removed || []) : [];
}
$("roomList").addEventListener("click", async (e) => {
  const sv = e.target.closest("button[data-rsave]"), dl = e.target.closest("button[data-rdel]");
  try {
    if (sv) {
      const i = Number(sv.dataset.rsave), r = rooms[i];
      const name = document.querySelector(`[data-rname="${i}"]`).value.trim();
      const ch = document.querySelector(`[data-rid="${i}"]`).value.trim();
      if (!name) return say("名前を入れてください。", true);
      if (!ROOM_ID_RE.test(ch)) return say("トークルームIDの形が違います（英数字と - だけ）。", true);
      if (rooms.some((x, j) => j !== i && x.channelId === ch)) return say("そのトークルームIDは、もう登録されています。", true);
      const changed = ch !== r.channelId;
      const next = rooms.map((x, j) => (j === i ? { ...x, name, channelId: ch, ...(changed ? { roomTitle: "", roomError: "", checkedAtISO: "", manual: true } : {}) } : x));
      const removed = (await loadRemoved()).filter((x) => x !== ch);
      if (changed) removed.push(r.channelId);
      await saveRooms(next, removed);
      say(`「${name}」を保存しました。${changed ? "トークルームはPCが1〜2分で確かめます。" : ""}`);
    }
    if (dl) {
      const i = Number(dl.dataset.rdel), r = rooms[i];
      const open = tasks.filter((t) => t.toUserId === r.userId && t.status === "open").length;
      if (!confirm(`「${r.name}」（${r.roomTitle || r.channelId}）を削除します。${open ? `\n未済のカードが ${open}件あり、そのカードの知らせも止まります。` : ""}\nよろしいですか？`)) return;
      const removed = [...(await loadRemoved()).filter((x) => x !== r.channelId), r.channelId];
      await saveRooms(rooms.filter((_, j) => j !== i), removed);
      say(`「${r.name}」を削除しました。`);
    }
  } catch (err) { say(`できませんでした（${err.code || err.message}）`, true); }
});
$("rAdd").addEventListener("click", async () => {
  const name = $("rName").value.trim(), ch = $("rId").value.trim();
  if (!name) return say("名前を入れてください。", true);
  if (!ROOM_ID_RE.test(ch)) return say("トークルームIDの形が違います（英数字と - だけ）。", true);
  if (rooms.some((x) => x.channelId === ch)) return say("そのトークルームIDは、もう登録されています。", true);
  try {
    const r = { name, userId: "ch-" + ch, channelId: ch, roomTitle: "", roomError: "", pageKey: newKey(), manual: true, checkedAtISO: "" };
    await saveRooms([...rooms, r], (await loadRemoved()).filter((x) => x !== ch));
    $("rName").value = ""; $("rId").value = "";
    say(`「${name}」を足しました。PCが1〜2分でトークルームを確かめます。`);
  } catch (err) { say(`足せませんでした（${err.code || err.message}）`, true); }
});

function refreshTo() {
  $("to").innerHTML = rooms.length
    ? rooms.map((r) => `<option value="${esc(r.userId)}">${esc(r.name)}さん（${esc(r.roomTitle || r.channelId)}）</option>`).join("")
    : '<option value="">（送れる相手がまだいません）</option>';
  if (person) $("to").value = person;
  preview();
}

/* ---------- 一覧（人 → 物件） ---------- */
function itemRow(t, kind, it, i) {
  const extra = [it.date ? dueLabel(it.date) : "", it.note].filter(Boolean).map(esc).join("　");
  return `<div class="it ${it.done ? "ok" : ""}"><button class="tog mk" data-tog="${esc(t.id)}" data-kind="${kind}" data-i="${i}" title="印を付け外し">${it.done ? "■" : "□"}</button><span class="q">${esc(it.q)}</span>${extra ? `<span class="ans">${extra}</span>` : ""}</div>`;
}

function renderList() {
  const showDone = $("showDone").checked;
  const byPerson = new Map();
  for (const t of tasks) {
    if (!showDone && t.status === "done") continue;
    if (rooms.length > 1 && t.toUserId !== person) continue;   // 選んでいる人のページだけ
    if (!byPerson.has(t.toName)) byPerson.set(t.toName, []);
    byPerson.get(t.toName).push(t);
  }
  if (!byPerson.size) { $("list").innerHTML = "<p>未済のリマインドはありません。</p>"; return; }
  let html = "";
  for (const [name, arr] of byPerson) {
    arr.sort((a, b) => (a.status !== b.status ? (a.status === "open" ? -1 : 1)
      : (a.due || "9999") !== (b.due || "9999") ? ((a.due || "9999") < (b.due || "9999") ? -1 : 1)
      : (a.createdAtISO < b.createdAtISO ? -1 : 1)));
    const openItems = arr.reduce((n, t) => n + [...(t.checks || []), ...(t.todos || [])].filter((x) => !x.done).length, 0);
    html += `<h2>${esc(name)}さん（物件 ${arr.filter((t) => t.status === "open").length}件・未確定 ${openItems}項目）</h2>`;
    for (const t of arr) {
      const od = t.status === "open" && isOverdue(t.due);
      const sent = t.sentError ? `<span class="tag red">送れていない：${esc(t.sentError)}</span>`
        : (!t.sentAtISO || t.resend) ? '<span class="tag">送信待ち</span>' : "";
      const checks = t.checks || [], todos = t.todos || [];
      html += `<div class="card ${t.status === "done" ? "done" : ""} ${od ? "over" : ""}">
        <div class="ttl">${esc(t.property)} ${t.status === "done" ? '<span class="tag green">済</span>' : ""} ${od ? '<span class="tag red">締め日過ぎ</span>' : ""} ${sent}</div>
        <div class="sub">締め日：${t.due ? esc(dueLabel(t.due)) : "なし"}${(t.dueLog || []).length ? `（変更 ${t.dueLog.length}回）` : ""}</div>
        <div class="items">
          ${checks.length ? `<h3>確認事項</h3>${checks.map((c, i) => itemRow(t, "checks", c, i)).join("")}` : ""}
          ${todos.length ? `<h3>やること</h3>${todos.map((c, i) => itemRow(t, "todos", c, i)).join("")}` : ""}
        </div>
        <div class="row">
          <a class="btnlike" href="${esc(taskUrl(t.id))}" target="_blank" rel="noopener">開く</a>
          ${t.status === "open" ? "" : `<button data-act="reopen" data-id="${esc(t.id)}">未済に戻す</button>`}
          ${t.status === "open" ? `<button data-act="quick" data-id="${esc(t.id)}">＋確認事項</button>` : ""}
          <button data-act="del" data-id="${esc(t.id)}" class="danger">消す</button>
        </div>
      </div>`;
    }
  }
  $("list").innerHTML = html;
}
$("showDone").addEventListener("change", renderList);
$("list").addEventListener("click", async (e) => {
  const tg = e.target.closest("button[data-tog]");
  const b = e.target.closest("button[data-act]");
  const now = new Date().toISOString();
  try {
    if (tg) {
      const t = tasks.find((x) => x.id === tg.dataset.tog), kind = tg.dataset.kind, i = Number(tg.dataset.i);
      const next = { ...t, [kind]: t[kind].map((x, j) => (j === i ? { ...x, done: !x.done } : x)) };
      const st = allDone(next) ? "done" : "open";
      await updateDoc(doc(db, "remindTasks", t.id), { [kind]: next[kind], status: st, doneAtISO: st === "done" ? now : "", updatedAtISO: now });
      return;
    }
    if (!b) return;
    const id = b.dataset.id;
    if (b.dataset.act === "quick") {   // このカードに足す：かんたん入力に物件名を入れて、確認事項の欄へ
      const t = tasks.find((x) => x.id === id);
      $("qProp").value = t ? t.property : "";
      $("qChecks").scrollIntoView({ behavior: "smooth", block: "center" });
      $("qChecks").focus();
      return;
    }
    if (b.dataset.act === "reopen") await updateDoc(doc(db, "remindTasks", id), { status: "open", doneAtISO: "", updatedAtISO: now });
    if (b.dataset.act === "del") {
      const t = tasks.find((x) => x.id === id);
      if (!confirm(`「${t ? t.property : ""}」を消します。元に戻せません。よろしいですか？`)) return;
      await deleteDoc(doc(db, "remindTasks", id));
    }
  } catch (err) { say(`できませんでした（${err.code || err.message}）`, true); }
});

/* ---------- 切り替え・ログイン ---------- */
function tab(which) {
  $("paneNew").hidden = which !== "new"; $("paneList").hidden = which !== "list"; $("paneRooms").hidden = which !== "rooms";
  $("tabNew").classList.toggle("on", which === "new"); $("tabList").classList.toggle("on", which === "list");
  $("tabRooms").classList.toggle("on", which === "rooms");
  $("msg").innerHTML = "";
}
$("tabNew").addEventListener("click", () => tab("new"));
$("tabRooms").addEventListener("click", () => tab("rooms"));
$("tabList").addEventListener("click", () => tab("list"));

$("loginBtn").addEventListener("click", async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (e.code !== "auth/popup-closed-by-user") say(`ログインできませんでした（${e.code}）`, true); }
});
$("logout").addEventListener("click", (e) => { e.preventDefault(); signOut(auth); });

onAuthStateChanged(auth, async (user) => {
  if (unsub) { unsub(); unsub = null; }
  $("login").hidden = !!user;
  $("content").hidden = true;
  if (!user) { $("label").textContent = "ログインしてください"; return; }
  $("who").textContent = user.email || "";
  try {
    const snap = await getDoc(doc(db, "remindRooms", "main"));
    rooms = snap.exists() ? (snap.data().rooms || []) : [];
  } catch (e) {
    $("label").textContent = "";
    $("msg").innerHTML = e.code === "permission-denied"
      ? '<p class="err">この画面は西村さん専用です。西村さんの会社の Google アカウントでログインしてください。</p>'
      : `<p class="err">読み込めませんでした（${esc(e.code)}）</p>`;
    return;
  }
  renderPeople();
  refreshTo();
  renderRooms(); renderQuick();
  if (!$("todos").children.length) resetForm();
  $("content").hidden = false;
  $("label").textContent = `送れる相手 ${rooms.length}人`;
  const u1 = onSnapshot(collection(db, "remindTasks"), (qs) => {
    tasks = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    const open = tasks.filter((t) => t.status === "open").length;
    $("tabList").textContent = `一覧（未済 ${open}）`;
    renderPeople();
    renderList();
    renderQuick();
    preview();
  }, (e) => { $("list").innerHTML = `<p class="err">一覧を読めませんでした（${esc(e.code)}）</p>`; });
  // PC が部屋の名前を確かめて埋めたら、すぐ画面にも出す（入力中の欄は描き直さない）
  const u2 = onSnapshot(doc(db, "remindRooms", "main"), (s) => {
    rooms = s.exists() ? (s.data().rooms || []) : [];
    $("label").textContent = `送れる相手 ${rooms.length}人`;
    renderPeople(); renderQuick();
    const a = document.activeElement;
    if (!(a && a.closest && a.closest("#paneRooms, #paneNew"))) { renderRooms(); refreshTo(); }
  });
  unsub = () => { u1(); u2(); };
});
</script>

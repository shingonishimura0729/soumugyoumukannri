<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>未済のリマインド</title>
<link rel="stylesheet" href="remind.css?v=2">
</head>
<body>
<header>
  <h1>📌 未済のリマインド</h1>
  <div id="label">読み込み中…</div>
</header>
<main>
  <div id="msg"></div>
  <div id="list"></div>
  <p class="note">物件ごとに開いて、確認事項の日付・ひとこと、済の印を入れられます。</p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { firebaseConfig } from "../assets/js/firebase-config.js";
import { esc, dueLabel, isOverdue, todayStr, taskUrl, itemHtml } from "./remind.js?v=2";

/*
 * 人ごとの未済一覧。毎朝のまとめのボタンから開く（?r=鍵）。
 * 中身は PC（lw_report/remind.py）が remindPeople/{鍵} に作る。済は1件の画面で押す。
 */
const $ = (id) => document.getElementById(id);
const key = new URLSearchParams(location.search).get("r") || "";
const db = getFirestore(initializeApp(firebaseConfig));

if (!key) { $("label").textContent = ""; $("msg").innerHTML = '<p class="err">リンクが正しくありません。LINE WORKS に届いたボタンから開いてください。</p>'; }
else onSnapshot(doc(db, "remindPeople", key), (snap) => {
  if (!snap.exists()) { $("label").textContent = ""; $("msg").innerHTML = '<p class="err">見つかりません。</p>'; return; }
  const p = snap.data(), rows = p.rows || [], today = todayStr();
  $("label").textContent = `${p.name}さん　未済 ${rows.length}件`;
  $("list").innerHTML = rows.length ? rows.map((r) => {
    const od = false, td = false;   // 締め日は使わない
    return `<div class="card ${od ? "over" : ""}">
      <div class="ttl">${esc(r.property)} ${od ? '<span class="tag red">締め日過ぎ</span>' : td ? '<span class="tag red">今日締め</span>' : ""}</div>
      <div class="items">
        ${(r.checks || []).length ? `<h3>確認事項</h3>${r.checks.map(itemHtml).join("")}` : ""}
        ${(r.todos || []).length ? `<h3>やること</h3>${r.todos.map(itemHtml).join("")}` : ""}
      </div>
      <div class="row"><a class="btnlike" href="${esc(taskUrl(r.k))}">開く（日付・ひとこと・済）</a></div>
    </div>`;
  }).join("") : "<p>未済のリマインドはありません。</p>";
}, (e) => { $("msg").innerHTML = `<p class="err">読み込めませんでした（${esc(e.code)}）</p>`; });
</script>
</body>
</html>

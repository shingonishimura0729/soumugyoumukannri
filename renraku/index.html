<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>工事予定のご連絡</title>
<!-- 画像を置かずに済ませる。置かないと毎回 favicon.ico を取りに行って404になる -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏡%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<header class="bar">
  <h1>工事予定のご連絡</h1>
  <!-- どのお客様のURLで開いているかを常に出す。取り違えを防ぐため -->
  <span class="tag hidden" id="who"></span>
</header>

<main>
  <div class="notice ok hidden" id="flash"></div>

  <!--
    URLを作るところ。**これが最初の一手**なので先頭に置く。
    すでにルームのURLで開いているときは、JS が この枠を末尾へ移す。
    毎週使う業者さんの目に、作り直しの操作を先に見せないため。
  -->
  <details class="panel" id="setup">
    <summary style="cursor:pointer" id="setup-title">このトークルーム用のURLを作る</summary>
    <p class="muted" id="setup-lead"></p>
    <label class="field">
      <span>お客様名（必須）</span>
      <input type="text" id="customer" placeholder="例：小野" autocomplete="off">
    </label>
    <p class="muted">
      <strong>どのトークルームのURLかを見分けるためだけに使います。</strong>
      お送りする文面には入りません。宛名は付きません。
    </p>
    <label class="field" style="margin-bottom:8px">
      <span>できたURL</span>
      <input type="text" id="room-url" readonly>
    </label>
    <button class="primary" id="copy-url" style="width:100%">URLをコピー</button>
    <p class="muted" id="url-note"></p>
    <p id="open-room-wrap" class="hidden" style="margin-bottom:0">
      <a class="btn" id="open-room" href="#" style="width:100%">このURLを開いて入力をはじめる</a>
    </p>
  </details>

  <section class="panel" data-needs-room>
    <h2>どの週の予定ですか</h2>
    <div class="row">
      <button id="week-prev" aria-label="前の週へ">◀</button>
      <div class="grow" style="text-align:center"><strong id="week-label">―</strong></div>
      <button id="week-next" aria-label="次の週へ">▶</button>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="muted grow" id="sync">―</span>
      <button id="reload" class="hidden">最新を読み込む</button>
    </div>
  </section>

  <section class="panel" data-needs-room>
    <h2>作業のある日に ○、休む日に ×</h2>
    <div class="days" id="days"></div>
  </section>

  <section class="panel" data-needs-room>
    <h2>ご注意いただきたい点</h2>
    <p class="muted">
      コンクリートを打つ、水道が止まる、お客様に家にいてほしい ―
      そういう日があれば足してください。無ければ空のままで大丈夫です。
    </p>
    <div class="list" id="notices"></div>
    <button id="add-notice" style="margin-top:8px">＋ 足す</button>
  </section>

  <section class="panel" data-needs-room>
    <h2>完成予定</h2>
    <div class="row">
      <input type="date" id="finish" class="grow">
    </div>
    <p class="muted" style="margin-bottom:0">
      未定なら空のままで構いません。
    </p>
  </section>

  <section class="panel" data-needs-room>
    <h2>お送りする文面</h2>
    <div class="preview" id="preview"></div>
    <button class="primary" id="copy" style="width:100%;margin-top:12px">文面をコピー</button>
    <p class="muted" id="copy-note" style="margin-bottom:0"></p>
  </section>

  <details class="panel" data-needs-room>
    <summary style="cursor:pointer">文体などの設定</summary>
    <p class="muted">この端末だけに覚えます。他の方の画面は変わりません。</p>
    <label class="field">
      <span>文体</span>
      <select id="tone">
        <option value="casual">やわらかい</option>
        <option value="formal">かしこまった</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="emoji"> 絵文字を入れる</label><br>
    <label class="check"><input type="checkbox" id="show-memo"> 作業内容も文面に載せる</label>
    <label class="field" style="margin-top:12px">
      <span>コンクリート：歩けるまでの日数（打設日から）</span>
      <input type="text" inputmode="numeric" id="cure-walk">
    </label>
    <label class="field" style="margin-bottom:0">
      <span>コンクリート：車を入れられるまでの日数（打設日から）</span>
      <input type="text" inputmode="numeric" id="cure-car">
    </label>
  </details>

</main>

<script type="module">
/**
 * 週の工事予定から、お客様へお送りする文面を組み立てる画面。
 *
 * **ログインは無い。URLが鍵。** トークルームが工事ごとに分かれていて、
 * 誰に向けた話かはその場の全員が分かっているため、現場やお客様を
 * 登録する画面は要らない。URLの `?r=` がそのまま「どの工事か」を表す。
 *
 * 使う順番は決まっている。
 *
 *   1. 工事ごとに1回だけ、このトークルーム用のURLを作ってトークに貼る
 *   2. 毎週、そのURLを開いて ○× と作業内容を入れる（自動で保存される）
 *
 * したがって **`?r=` が無いときは 1 しかさせない。** 他の枠を出すと、
 * 入れたものが保存されないまま消える。
 *
 * お客様名は**どのトークルームのURLかを見分けるためだけ**のもので、
 * 文面には入れない。宛名は付けない（`buildWeeklyMessage` に渡さない）。
 */

import {
  CURE_DEFAULT, DAYS_IN_WEEK, NOTICE_LABELS, NOTICE_TYPES,
  addDays, buildWeeklyMessage, emptyDays, fillCureDates,
  formatDayLabel, parseISODate, upcomingWeekStart, weekDates, weekLabel,
} from "../assets/js/domain.js";
import {
  isRoomId, loadWeek, newRoomId, saveWeek,
} from "../assets/js/store.js";

const $ = (id) => document.getElementById(id);

/** 設定を覚えておく場所。この端末のブラウザの中だけ */
const STORE_KEY = "renraku_settings";

const params = new URLSearchParams(location.search);

const state = {
  weekStart: upcomingWeekStart(new Date()),
  days: emptyDays(),
  notices: [],
  /** 組み立てた文面。コピーするのはこれ。画面の見た目とは分けて持つ */
  text: "",
  /** トークルームのID。URLに入っていなければ null（保存しない） */
  roomId: isRoomId(params.get("r")) ? params.get("r") : null,
  /** 読み込み中は保存しない。読んだ内容で上書きしてしまうため */
  loading: false,
};


/* ---- 設定の出し入れ -------------------------------------- */

/**
 * 覚えていた設定を読む。
 *
 * ブラウザによっては保存が使えない（プライベートモードなど）。
 * **読めなくても画面が動くようにする**ため、失敗は既定値で受け流す。
 */
function loadSettings() {
  const fallback = {
    tone: "casual", emoji: true, showMemo: false,
    cure: { walk: CURE_DEFAULT.walk, car: CURE_DEFAULT.car },
  };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) ?? "{}");
    return {
      tone: saved.tone === "formal" ? "formal" : "casual",
      emoji: saved.emoji !== false,
      showMemo: saved.showMemo === true,
      cure: {
        walk: Number.isFinite(saved.cure?.walk) ? saved.cure.walk : CURE_DEFAULT.walk,
        car: Number.isFinite(saved.cure?.car) ? saved.cure.car : CURE_DEFAULT.car,
      },
    };
  } catch {
    return fallback;
  }
}

function saveSettings() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(settings()));
  } catch {
    // 保存できなくても文面は作れる。黙って続ける
  }
}

/** いま画面に入っている設定 */
function settings() {
  const walk = Number($("cure-walk").value);
  const car = Number($("cure-car").value);
  return {
    tone: $("tone").value,
    emoji: $("emoji").checked,
    showMemo: $("show-memo").checked,
    cure: {
      walk: Number.isFinite(walk) && walk >= 0 ? walk : CURE_DEFAULT.walk,
      car: Number.isFinite(car) && car >= 0 ? car : CURE_DEFAULT.car,
    },
  };
}

/* ---- 保存と読み込み -------------------------------------- */

/** 打ち終わるのを待ってから保存する。1文字ごとに書きに行かないため */
const SAVE_WAIT_MS = 800;
let saveTimer = null;

function sync(message) {
  $("sync").textContent = message;
}

/** `2026-09-28T05:32:10.000Z` → `9/28 14:32` */
function shortTime(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const pad = (n) => String(n).padStart(2, "0");
  return `${date.getMonth() + 1}/${date.getDate()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
}

/**
 * いまの週の内容を読み込む。
 *
 * 週を動かしたときと、開いたときに呼ぶ。
 * **読んでいる間は保存しない。** 途中の状態を書き戻してしまうため。
 */
async function loadCurrentWeek() {
  // URLを作る前は読むものが無い。案内は setup の枠に出してある
  if (!state.roomId) return;

  state.loading = true;
  sync("読み込み中…");
  $("reload").classList.add("hidden");

  try {
    const saved = await loadWeek(state.roomId, state.weekStart);

    state.days = Array.isArray(saved?.days) && saved.days.length === DAYS_IN_WEEK
      ? saved.days.map((d) => ({ work: d.work !== false, memo: String(d.memo ?? "") }))
      : emptyDays();
    state.notices = Array.isArray(saved?.notices)
      ? saved.notices.map((n) => ({ ...n }))
      : [];
    $("finish").value = typeof saved?.finishDate === "string"
      ? saved.finishDate
      : (parseISODate(params.get("f") ?? "") ? params.get("f") : "");

    sync(saved?.updatedAtISO
      ? `最終更新 ${shortTime(saved.updatedAtISO)}`
      : "まだ入力されていません");
    $("reload").classList.remove("hidden");
  } catch (err) {
    sync("読み込めませんでした。電波を確かめて、画面を更新してください。");
    console.error(err);
  } finally {
    state.loading = false;
    renderDays();
    renderNotices();
    render();
  }
}

/** 入力が変わったときに呼ぶ。少し待ってからまとめて保存する */
function scheduleSave() {
  if (!state.roomId || state.loading) return;
  clearTimeout(saveTimer);
  sync("保存待ち…");
  saveTimer = setTimeout(save, SAVE_WAIT_MS);
}

async function save() {
  sync("保存中…");
  try {
    const at = await saveWeek(state.roomId, state.weekStart, {
      days: state.days,
      notices: state.notices,
      finishDate: $("finish").value,
    });
    sync(`保存しました ${shortTime(at)}`);
  } catch (err) {
    sync("保存できませんでした。電波を確かめてください。入力は画面に残っています。");
    console.error(err);
  }
}

$("reload").addEventListener("click", loadCurrentWeek);

/**
 * 画面を閉じる前に、保存待ちが残っていたら知らせる。
 *
 * 待ち時間のあいだに閉じられると、最後の入力が消える。
 */
window.addEventListener("beforeunload", (e) => {
  if (saveTimer !== null && $("sync").textContent.startsWith("保存待ち")) {
    e.preventDefault();
  }
});

/* ---- 立ち上げ -------------------------------------------- */

/**
 * URLを作る枠を、いまの状況に合う置き方にする。
 *
 * - `?r=` が無い … 先頭で開いたままにし、**他の枠は出さない。**
 *   ここで入れても保存されないので、入れさせるほうが酷い
 * - `?r=` がある … 末尾へ移して畳む。毎週使う人に作り直しを見せない
 */
function placeSetup() {
  const setup = $("setup");

  if (!state.roomId) {
    setup.open = true;
    $("setup-title").textContent = "まず、このトークルーム用のURLを作ります";
    $("setup-lead").textContent =
      "工事ごとに1回だけの作業です。ここで作ったURLをトークルームに貼ると、"
      + "次からは開くだけで前に入れた内容が出てきます。"
      + "このURLでないと入力が保存されません。";
    for (const el of document.querySelectorAll("[data-needs-room]")) {
      el.classList.add("hidden");
    }
    return;
  }

  document.querySelector("main").append(setup);
  setup.open = false;
  $("setup-title").textContent = "このトークルーム用のURLを作り直す";
  $("setup-lead").textContent =
    "ふだんは触りません。トークルームを新しく作ったときだけ使います。";
}

function start() {
  const saved = loadSettings();
  $("tone").value = saved.tone;
  $("emoji").checked = saved.emoji;
  $("show-memo").checked = saved.showMemo;
  $("cure-walk").value = String(saved.cure.walk);
  $("cure-car").value = String(saved.cure.car);

  // お客様名はURLから。完成予定は保存されていればそちらが勝つ（loadCurrentWeek で入る）
  $("customer").value = params.get("c") ?? "";
  $("finish").value = parseISODate(params.get("f") ?? "") ? params.get("f") : "";

  placeSetup();
  renderWeek();
  renderNotices();
  render();
  loadCurrentWeek();
}

/* ---- 週 -------------------------------------------------- */

function renderWeek() {
  $("week-label").textContent = weekLabel(state.weekStart);
  renderDays();
}

function moveWeek(delta) {
  // 待ちを捨てる。移る前の週の内容を、移った先へ書いてしまわないため
  clearTimeout(saveTimer);
  state.weekStart = addDays(state.weekStart, delta * DAYS_IN_WEEK);
  renderWeek();
  render();
  loadCurrentWeek();
}

$("week-prev").addEventListener("click", () => moveWeek(-1));
$("week-next").addEventListener("click", () => moveWeek(1));

/* ---- 7日の○× -------------------------------------------- */

function renderDays() {
  const box = $("days");
  box.textContent = "";
  const dates = weekDates(state.weekStart);

  state.days.forEach((day, i) => {
    const row = document.createElement("div");
    row.className = `day${day.work ? "" : " off"}`;

    const date = document.createElement("div");
    date.className = "date";
    // `new Date("2026-09-29")` は UTC と見なされて前日になる国がある
    const dow = parseISODate(dates[i]).getDay();
    if (dow === 0) date.classList.add("sun");
    if (dow === 6) date.classList.add("sat");
    date.textContent = formatDayLabel(dates[i]);

    const toggle = document.createElement("div");
    toggle.className = "toggle";
    for (const [mark, works] of [["○", true], ["×", false]]) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = mark;
      b.setAttribute("aria-pressed", String(day.work === works));
      b.setAttribute("aria-label", `${formatDayLabel(dates[i])} ${works ? "作業あり" : "休工"}`);
      b.addEventListener("click", () => {
        state.days[i].work = works;
        renderDays();
        render();
        scheduleSave();
      });
      toggle.append(b);
    }

    row.append(date, toggle);

    /**
     * 休工の日は作業内容の欄を出さない。
     *
     * 薄く残すと「入れられるのに反応しない欄」に見えて、壊れたと思われる。
     * 入れてあった内容は state に残るので、○に戻せばそのまま出てくる。
     */
    if (day.work) {
      const memo = document.createElement("input");
      memo.type = "text";
      memo.className = "memo";
      // 1行に収めるので短くする。長いと欄の中で切れて読めない
      memo.placeholder = "例：ブロック積み";
      memo.value = day.memo;
      memo.addEventListener("input", () => {
        state.days[i].memo = memo.value;
        render();
        scheduleSave();
      });
      row.append(memo);
    } else {
      const rest = document.createElement("span");
      rest.className = "muted";
      rest.textContent = day.memo ? `休工（${day.memo}）` : "休工";
      row.append(rest);
    }

    box.append(row);
  });
}

/* ---- 注意事項 -------------------------------------------- */

/** ラベル付きの入力欄をひとつ作る */
function field(labelText, input) {
  const label = document.createElement("label");
  label.className = "field";
  const span = document.createElement("span");
  span.textContent = labelText;
  label.append(span, input);
  return label;
}

function renderNotices() {
  const box = $("notices");
  box.textContent = "";

  state.notices.forEach((notice, i) => {
    const panel = document.createElement("div");
    panel.style.cssText = "border:1px solid var(--line);border-radius:var(--radius);padding:12px";

    const kind = document.createElement("select");
    for (const type of Object.values(NOTICE_TYPES)) {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = NOTICE_LABELS[type];
      kind.append(option);
    }
    kind.value = notice.type ?? NOTICE_TYPES.CONCRETE;

    const date = document.createElement("input");
    date.type = "date";
    date.value = notice.date ?? "";

    const detail = document.createElement("input");
    detail.type = "text";
    detail.placeholder = "内容（例：配管位置の確認）";
    detail.value = notice.detail ?? "";

    const kindField = field("種類", kind);
    const dateField = field("日付", date);
    const detailField = field("内容", detail);

    /** 打設と断水は日付だけで足りる。内容欄を出すと何を書くか迷わせる */
    const syncDetail = () => {
      const needsDetail =
        kind.value === NOTICE_TYPES.HOME || kind.value === NOTICE_TYPES.OTHER;
      detailField.classList.toggle("hidden", !needsDetail);
    };

    kind.addEventListener("change", () => {
      state.notices[i].type = kind.value;
      syncDetail();
      render();
      scheduleSave();
    });
    date.addEventListener("change", () => {
      state.notices[i].date = date.value;
      render();
      scheduleSave();
    });
    detail.addEventListener("input", () => {
      state.notices[i].detail = detail.value;
      render();
      scheduleSave();
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "danger";
    remove.textContent = "この行を消す";
    remove.addEventListener("click", () => {
      state.notices.splice(i, 1);
      renderNotices();
      render();
      scheduleSave();
    });

    panel.append(kindField, dateField, detailField, remove);
    box.append(panel);
    syncDetail();
  });
}

$("add-notice").addEventListener("click", () => {
  state.notices.push({
    id: `n${Date.now()}`,
    type: NOTICE_TYPES.CONCRETE,
    date: state.weekStart,
    detail: "",
  });
  renderNotices();
  render();
  scheduleSave();
});

/* ---- 文面 ------------------------------------------------ */

function render() {
  const s = settings();

  state.text = buildWeeklyMessage({
    // お客様名は渡さない。URLを見分けるためのもので、文面には入れない
    weekStart: state.weekStart,
    days: state.days,
    // 打設日から解放日を埋めるのは表示のときだけ。入力欄の値はそのまま残す
    notices: state.notices.map((n) => fillCureDates(n, s.cure)),
    finishDate: $("finish").value,
    tone: s.tone,
    emoji: s.emoji,
    showMemo: s.showMemo,
  });

  renderPreview();
  renderRoomUrl();
}

/** 罫線だけの行。飾りなので枠を付けない */
const RULE_ONLY = /^[━─\s]+$/;

/**
 * 文面を段落ごとに分けて出す。
 *
 * **コピーされるのは `state.text` で、この見た目は影響しない。**
 * 画面では区切って読みやすくし、貼るときは組み立てたままの形を渡す。
 */
function renderPreview() {
  const box = $("preview");
  box.textContent = "";

  for (const block of state.text.split("\n\n")) {
    const para = document.createElement("div");
    para.className = RULE_ONLY.test(block) ? "para rule" : "para";
    para.textContent = block;
    box.append(para);
  }
}

$("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(state.text);
    $("copy-note").textContent = "コピーしました。トークルームに貼ってください。";
  } catch {
    // 機種や設定でコピーが使えないことがある。選んだ状態にして長押しに委ねる
    const range = document.createRange();
    range.selectNodeContents($("preview"));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    $("copy-note").textContent =
      "自動でコピーできませんでした。選んだ状態にしたので、長押しでコピーしてください。";
  }
});

// お客様名はURLを見分けるためのもの。保存もしないし、文面にも入らない
$("customer").addEventListener("input", renderRoomUrl);
$("finish").addEventListener("input", () => { render(); scheduleSave(); });
for (const id of ["tone", "emoji", "show-memo", "cure-walk", "cure-car"]) {
  $(id).addEventListener("input", () => { saveSettings(); render(); });
}

/**
 * うまくいけば知らせ、だめなら選んだ状態にする。
 *
 * 現場のスマホでは、機種や設定でコピーが使えないことがある。
 * **できませんでした、で終わらせない**ように、手でコピーできる形にしておく。
 */
async function copyFrom(element, note, what = "") {
  try {
    await navigator.clipboard.writeText(element.textContent || element.value);
    note.textContent = `${what}をコピーしました。トークルームに貼ってください。`;
  } catch {
    if (element.select) {
      element.select();
    } else {
      const range = document.createRange();
      range.selectNodeContents(element);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
    note.textContent =
      "自動でコピーできませんでした。選んだ状態にしたので、長押しでコピーしてください。";
  }
}

/* ---- このルーム用のURL ----------------------------------- */

/**
 * 作るURLに入れるトークルームID。
 *
 * すでにルームのURLで開いているならそれを引き継ぐ。**引き継がないと
 * 新しいIDになり、それまでに入力したものが見えなくなる。**
 * 新しく作る場合は、開いている間は同じIDを使い回す（押すたびに変わらないように）。
 */
const urlRoomId = state.roomId ?? newRoomId();

/**
 * URLを組み立てて出す。
 *
 * **お客様名が空のあいだはURLを出さない。** 名前の無いURLが何本もトークに
 * 貼られると、どれがどの工事のものか誰にも分からなくなる。
 */
function renderRoomUrl() {
  const customer = $("customer").value.trim();

  $("who").textContent = customer ? `${customer}様` : "";
  $("who").classList.toggle("hidden", !customer);

  if (!customer) {
    $("room-url").value = "";
    $("copy-url").disabled = true;
    $("url-note").textContent = "お客様名を入れると、このトークルーム用のURLが出ます。";
    $("open-room-wrap").classList.add("hidden");
    return;
  }

  const url = new URL(location.pathname, location.origin);
  url.searchParams.set("r", urlRoomId);
  url.searchParams.set("c", customer);
  const finish = $("finish").value;
  if (finish) url.searchParams.set("f", finish);

  $("room-url").value = url.href;
  $("copy-url").disabled = false;
  // すでにそのURLで開いているときは出さない。押す先が今の画面になってしまう
  $("open-room").href = url.href;
  $("open-room-wrap").classList.toggle("hidden", Boolean(state.roomId));
  // 名前を打ち替えればURLも変わる。前の「コピーしました」は消す
  $("url-note").textContent = "";
}

$("copy-url").addEventListener("click", () =>
  copyFrom($("room-url"), $("url-note"), "URL"));
$("room-url").addEventListener("focus", () => $("room-url").select());

start();
</script>

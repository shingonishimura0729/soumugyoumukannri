<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#556529">
<title>植栽 選定チェック</title>
<style>
  /* アーキガーデンのコンセプトカラー：ガーデングリーン #556529・ロゴグリーン #747F4D・墨 #363735・生成り #F2F0E8・砂色 #CAC0A7 */
  :root { --bg:#F2F0E8; --card:#fff; --ink:#363735; --sub:#76766c; --line:#e1dccd; --head:#556529; --soft:#eceadd; --accent:#556529; --logo:#747F4D; --sand:#CAC0A7; --warn:#b5651d; --warnbg:#fbefe4; --done:#9a9a88; --edit:#556529; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151714; --card:#1f221d; --ink:#eceee9; --sub:#9aa093; --line:#33382f; --head:#3d4a1d; --soft:#26301f; --accent:#9fb35a; --logo:#9aa56c; --sand:#8c8470; --warn:#e3a066; --warnbg:#3a2a1c; --done:#7c8a71; --edit:#b5c47a; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Hiragino Sans","Yu Gothic UI",sans-serif; -webkit-text-size-adjust:100%; }
  header { background:var(--head); color:#fff; padding:10px 12px 8px; position:sticky; top:0; z-index:5; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { white-space:nowrap; }
  #meta { flex:1; min-width:0; }
  /* 使い方動画：見出しの一番右に、丸い再生マーク付きで目立たせる */
  #howto { flex:none; margin-left:auto; display:flex; align-items:center; gap:6px; padding:4px 10px 4px 4px; border-radius:999px; border:none; background:#fff; color:var(--head); font-weight:bold; font-size:12px; line-height:1.15; text-align:left; box-shadow:0 1px 4px rgba(0,0,0,.25); cursor:pointer; }
  #howto .play { width:26px; height:26px; border-radius:50%; background:#d9433a; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; padding-left:2px; }
  #howto:hover { background:#fff6e5; }
  header h1 { margin:0; font-size:16px; }
  #meta { font-size:11px; opacity:.85; }
  .bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:6px; }
  .bar button { font-size:13px; padding:6px 10px; border-radius:8px; border:none; background:#fff; color:var(--head); font-weight:bold; }
  .bar button:disabled { opacity:.5; }
  .bar select { font-size:13px; padding:5px 6px; border-radius:8px; border:none; background:#fff; color:var(--head); }
  /* 編集ボタン：枠と色を付けて押せることが分かるように */
  .ph h2 .ppen { border:1px solid var(--edit); background:var(--card); color:var(--edit); font-size:12px; font-weight:bold; padding:3px 8px; border-radius:14px; margin-left:6px; vertical-align:1px; }
  .gone.props { padding:4px 2px; }
  .card .ph .addtag { font-size:10px; color:var(--edit); border:1px solid var(--edit); border-radius:4px; padding:0 3px; margin-left:5px; font-weight:normal; vertical-align:2px; }
  /* iPhone の日付欄は中身の幅より縮まないので、見た目を外して幅いっぱいに収める */
  .form input[type=date] { -webkit-appearance:none; appearance:none; display:block; width:100%; min-width:0; max-width:100%; text-align:left; min-height:36px; }
  .form input[type=date]::-webkit-date-and-time-value { text-align:left; }
  .form .grid.two { grid-template-columns:1fr 1fr; }
  .form .grid.two label.wide { grid-column:1 / -1; }
  .bar label { font-size:12px; display:flex; align-items:center; gap:4px; }
  #shownCount { font-size:11px; opacity:.9; }
  .note:empty { display:none; }
  /* 一覧表（携帯では横に動かす。物件名の列は左に固定） */
  .tblwrap { overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:10px; background:var(--card); margin:8px 0; }
  main:has(.tblwrap) { max-width:1400px; }
  .tbl { border-collapse:separate; border-spacing:0; font-size:12.5px; min-width:720px; width:100%; }
  .tbl th { background:var(--head); color:#fff; font-weight:bold; padding:6px 8px; text-align:left; white-space:nowrap; font-size:12px; }
  .tbl td { padding:4px 8px; border-top:1px solid var(--line); vertical-align:middle; background:var(--card); white-space:nowrap; line-height:1.35; }
  .tbl tbody tr:nth-child(even) td { background:color-mix(in srgb, var(--soft) 45%, var(--card)); }
  .tbl th:first-child, .tbl td:first-child { position:sticky; left:0; z-index:1; box-shadow:2px 0 0 var(--line); }
  .tbl td.nm { max-width:170px; overflow:hidden; text-overflow:ellipsis; }
  .tbl .nmbtn { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:none; background:none; padding:0; color:var(--edit); font-weight:bold; font-size:13px; text-align:left; text-decoration:underline; }
  .tbl td.dt { white-space:nowrap; }
  .tbl td.dt small { margin-left:4px; color:var(--sub); font-size:11px; }
  .tbl td.dt.soon small { color:var(--warn); font-weight:bold; }
  .tbl td.dt.late { background:var(--warnbg) !important; }
  .tbl td.dt.late small { color:var(--warn); font-weight:bold; }
  .tbl td.pl { min-width:250px; }
  .tbl .pline { display:flex; align-items:center; gap:6px; padding:1px 0; }
  .tbl .pline input { width:18px; height:18px; margin:0; accent-color:var(--accent); flex:none; }
  .tbl .pline .pn { flex:1; }
  .tbl .pline .ps { color:var(--sub); white-space:nowrap; font-size:11.5px; }
  .tbl .pline.done .pn { color:var(--done); text-decoration:line-through; }
  .tbl td.num { white-space:nowrap; font-weight:bold; text-align:center; }
  .tbl td.num.ok { color:var(--accent); }
  .tbl tr.alldone td { opacity:.75; }
  .tbl td a, .tbl td .lnk { color:var(--edit); white-space:nowrap; font-size:12.5px; border:none; background:none; padding:0; margin-right:6px; }
  .tbl td.nt { font-size:11.5px; color:var(--sub); max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .tbl .warn { color:var(--warn); font-weight:bold; }
  @media (max-width:600px) { .tbl td.nm { max-width:118px; } .tbl .nmbtn { font-size:12.5px; } .tbl td, .tbl th { padding:6px; } }
  /* ブラウザで開く注意書き（トップに必ず出す） */
  .bnote { margin:8px 0 4px; padding:8px 10px; border-radius:10px; border:1px solid var(--warn); background:var(--warnbg); color:var(--ink); font-size:12.5px; line-height:1.6; }
  .bnote b { color:var(--warn); }
  .bnote a { color:var(--edit); font-weight:bold; white-space:nowrap; }
  .bnote.inapp { border-width:2px; font-size:13.5px; }
  /* 使い方動画 */
  #videoBox { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; padding:12px; }
  #videoBox[hidden] { display:none; }
  #videoBox .vb { background:var(--card); border-radius:12px; overflow:hidden; width:min(960px, 100%); }
  #videoBox .vh { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; }
  #videoBox .vh button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 10px; font-size:13px; }
  #videoBox video { display:block; width:100%; max-height:80vh; background:#000; }
  .pinfo { display:flex; gap:10px; flex-wrap:wrap; margin-top:4px; font-size:12.5px; }
  .pinfo a, .pinfo button { color:var(--edit); text-decoration:none; border:none; background:none; padding:0; font-size:12.5px; }
  .pinfo .draw { font-weight:bold; }
  .pinfo a, .pinfo button { padding:2px 6px; margin:0 -6px; border-radius:6px; cursor:pointer; }
  .pinfo a:hover, .pinfo button:hover { background:var(--soft); text-decoration:underline; }
  /* カーソルを合わせたときの説明（カードの枠で切れないよう、画面の上に重ねる） */
  #tip { position:fixed; z-index:50; max-width:min(360px, calc(100vw - 24px)); padding:7px 10px; border-radius:8px; background:#2b2f29; color:#fff; font-size:12px; line-height:1.5; pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25); word-break:break-all; display:none; }
  #tip b { display:block; font-size:12.5px; }
  #tip span { opacity:.8; }
  .form .drop { margin-top:8px; border:2px dashed var(--edit); border-radius:10px; padding:12px; text-align:center; color:var(--edit); cursor:pointer; background:var(--card); }
  .form .drop.over { background:var(--soft); }
  .form .drop .dmsg { font-size:13.5px; font-weight:bold; word-break:break-all; }
  .form .drop .dsub { font-size:11px; color:var(--sub); margin-top:2px; }
  .form .drop .lnk { color:var(--warn); font-size:12px; margin-left:4px; }
  .gonesel { font-size:13px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--sub); max-width:100%; }
  .gonebox { margin-top:6px; padding:8px 10px; border:1px dashed var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:14px; }
  .gonebox .back { margin-top:6px; font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid var(--edit); background:var(--card); color:var(--edit); }
  /* いつ準備・いつ施工かを一目で */
  .when { display:flex; gap:6px; flex-wrap:wrap; margin-top:3px; }
  .when .d { font-size:12.5px; padding:2px 8px; border-radius:6px; background:var(--card); border:1px solid var(--line); color:var(--ink); white-space:nowrap; }
  .when .d b { font-size:13.5px; }
  .when .d em { font-style:normal; font-size:11.5px; margin-left:4px; color:var(--sub); }
  .when .d.soon { border-color:var(--warn); }
  .when .d.soon em { color:var(--warn); font-weight:bold; }
  .when .d.late { background:var(--warnbg); border-color:var(--warn); }
  .when .d.late em { color:var(--warn); font-weight:bold; }
  .when .con { font-size:12px; color:var(--sub); align-self:center; }
  .form .hint { font-size:10.5px; color:var(--sub); margin-top:2px; display:flex; gap:6px; align-items:center; }
  .form .hint button { border:none; background:none; color:var(--edit); font-size:11px; padding:0; text-decoration:underline; }
  #who { font-size:11px; opacity:.9; margin-left:auto; }
  main { padding:6px 10px 40px; max-width:760px; margin:0 auto; }
  .note { font-size:12px; color:var(--sub); margin:4px 2px 6px; line-height:1.5; }
  .err { color:var(--warn); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:8px 0; overflow:hidden; }
  .card.alldone { opacity:.6; }
  .ph { background:var(--soft); padding:6px 10px; }
  .ph h2 { margin:0; font-size:15px; display:flex; justify-content:space-between; gap:8px; }
  .ph h2 .cnt { font-size:12px; font-weight:normal; color:var(--sub); white-space:nowrap; }
  .ph h2 .cnt b { color:var(--ink); }
  .ph .sub { font-size:12px; color:var(--sub); margin-top:1px; }
  .ph .sub b { color:var(--ink); }
  .tags { margin-top:3px; display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:10.5px; padding:1px 6px; border-radius:20px; background:var(--card); border:1px solid var(--line); color:var(--sub); }
  .tag.warn { background:var(--warnbg); border-color:var(--warn); color:var(--warn); }
  .tag.ok { border-color:var(--accent); color:var(--accent); }
  .row { display:flex; gap:8px; align-items:center; padding:5px 6px 5px 10px; border-top:1px solid var(--line); min-height:38px; }
  .row input[type=checkbox] { width:22px; height:22px; margin:0; accent-color:var(--accent); flex:none; }
  .row .body { flex:1; min-width:0; }
  .row .line { display:flex; align-items:baseline; gap:8px; }
  .row .name { font-size:15px; flex:1; min-width:0; word-break:break-all; }
  .row .spec { font-size:13px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .row .spec .warn { color:var(--warn); font-weight:bold; }
  .row.done .name { color:var(--done); text-decoration:line-through; }
  .row .by { font-size:10.5px; color:var(--sub); margin-top:1px; }
  .row .by.ed { color:var(--edit); }
  .card.editing { border-color:var(--edit); box-shadow:0 0 0 1px var(--edit); }
  .form .sec { font-size:12px; color:var(--sub); font-weight:bold; margin:12px 0 2px; }
  .erow { padding:6px 0; border-top:1px dashed var(--line); }
  .erow .top { display:flex; gap:6px; align-items:center; }
  .erow .top .f-name { flex:1; }
  .erow .x, .erow .back { flex:none; font-size:13px; padding:6px 10px; border-radius:8px; border:1px solid var(--warn); background:var(--card); color:var(--warn); }
  .erow .back { border-color:var(--edit); color:var(--edit); }
  .erow.del .f-name { text-decoration:line-through; opacity:.55; }
  .erow .grid { margin-top:4px; }
  .erow .orig { margin:3px 0 0; }
  .form .addrow { border:1px dashed var(--edit); background:none; color:var(--edit); font-size:14px; width:100%; padding:8px; border-radius:8px; margin-top:6px; }
  .row .pen { flex:none; border:1px solid var(--edit); background:var(--card); color:var(--edit); font-size:16px; width:34px; height:30px; padding:0; border-radius:8px; line-height:1; }
  .row.added .name::after { content:"追加"; font-size:10px; color:var(--edit); border:1px solid var(--edit); border-radius:4px; padding:0 3px; margin-left:5px; vertical-align:2px; }
  .empty { padding:8px 10px; border-top:1px solid var(--line); color:var(--warn); font-size:13px; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:4px 10px; border-top:1px solid var(--line); font-size:12px; }
  .foot button, .lnk { border:none; background:none; color:var(--edit); font-size:13px; padding:4px 0; }
  .gone { padding:2px 10px 6px; font-size:12px; color:var(--sub); }
  .gone span { text-decoration:line-through; }
  .form { padding:8px 10px; border-top:1px solid var(--line); background:var(--bg); }
  .form .orig { font-size:11px; color:var(--sub); margin-bottom:4px; }
  .form input { font-size:16px; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); min-width:0; }
  .form .f-name { width:100%; }
  .form .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:6px; }
  .form .grid input { width:100%; }
  .form .grid label { min-width:0; font-size:11px; color:var(--sub); display:flex; flex-direction:column; gap:2px; }
  .form .btns { display:flex; gap:8px; margin-top:8px; }
  .form .btns button { font-size:14px; padding:7px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .form .btns .save { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:bold; }
  .form .btns .del { margin-left:auto; color:var(--warn); border-color:var(--warn); }
  #login { display:none; }
  /* 株立ちの選択（絵つき） */
  /* 編集：木ごとに小さなカード。入力欄は白をやめて薄いベージュ、高さ〜株立ち・写真を1行に */
  .form .erow { background:var(--card); border:1px solid var(--line); border-top:1px solid var(--line); border-radius:10px; padding:6px 7px; margin-top:6px; }
  .form .erow input, .form .erow select { background:var(--soft); border:1px solid transparent; }
  .form .erow input:focus, .form .erow select:focus { border-color:var(--accent); outline:none; background:var(--card); }
  .form .erow .x, .form .erow .back { padding:4px 9px; font-size:12px; }
  .form .erow .grid { grid-template-columns:1fr .75fr 1.55fr 2.2fr auto; gap:5px; margin-top:5px; align-items:end; }
  .form .erow .grid input { padding:5px 5px; }
  .form .erow select { width:100%; min-width:0; font-size:16px; padding:5px 4px; min-height:34px; border-radius:8px; color:var(--ink); }
  .kabu-ph { width:26px; height:34px; object-fit:cover; border-radius:6px; border:1px solid var(--line); cursor:zoom-in; display:block; }
  .kabu-ph[hidden] { display:none; }
  .kabu-ph-sp { width:26px; }
  #kabuBig { position:fixed; inset:0; z-index:50; background:#000; color:#fff; }
  #kabuBig img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #kabuBig div { position:absolute; left:0; right:0; bottom:0; padding:10px 12px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.75)); text-align:center; font-size:16px; font-weight:bold; }
  #kabuBig div small { display:block; font-size:12px; font-weight:normal; opacity:.85; margin-top:2px; }

  /* ---- 上の固定部分（余白を詰め、ボタンの役割を色で分ける） ---- */
  header { padding:6px 10px 6px; box-shadow:0 1px 4px rgba(0,0,0,.18); }
  .top { gap:8px; }
  .ttl { min-width:0; flex:1; line-height:1.2; }
  header h1 { font-size:15px; letter-spacing:.02em; }
  #meta { display:block; font-size:10.5px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #who { font-size:10.5px; opacity:.85; white-space:nowrap; margin:0; text-align:right; }
  #who a { color:#fff; }
  #howto { margin-left:0; padding:3px 9px 3px 3px; font-size:11px; }
  #howto .play { width:24px; height:24px; font-size:11px; }
  .bar { margin-top:5px; gap:5px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .bar::-webkit-scrollbar { display:none; }
  .bar > * { flex:none; }
  .bar button, .bar select { height:30px; font-size:12.5px; border-radius:8px; }
  /* 更新＝白、追加・ログイン＝砂色、表示の切り替え＝生成りの切り替え、絞り込み＝枠だけ */
  .bar .b-refresh { background:#fff; color:var(--head); border:none; padding:0 10px; font-weight:bold; }
  .bar .b-add { background:var(--sand); color:#363735; border:none; padding:0 10px; font-weight:bold; }
  .seg { display:flex; background:rgba(255,255,255,.18); border-radius:8px; padding:2px; }
  .seg button { height:26px; padding:0 10px; border:none; border-radius:6px; background:none; color:#fff; font-size:12px; font-weight:bold; }
  .seg button.on { background:#F2F0E8; color:var(--head); }
  #shownCount { font-size:11px; opacity:.9; margin-left:auto; padding-left:4px; white-space:nowrap; }
  /* 絞り込みは 2列×2段 にそろえ、携帯の幅でも全部見えるようにする（広い画面では1段） */
  /* 絞り込みの4つは1行に並べる */
  .bar.filters { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:4px; overflow:visible; }
  @media (min-width:700px) { .bar.filters { grid-template-columns:repeat(4, minmax(0, 160px)); } }
  .bar.filters select, .bar.filters .chk { font-size:12px; padding:0 2px 0 6px; }
  .bar.filters select, .bar.filters .chk { width:100%; min-width:0; }
  .bar.filters .chk { justify-content:center; }
  .bar.filters select { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.45); padding:0 6px; }
  .bar.filters select option { color:#363735; background:#fff; }
  .bar.filters .chk { font-size:12px; height:30px; padding:0 8px; border-radius:8px; border:1px solid rgba(255,255,255,.45); display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .bar.filters .chk input { margin:0; accent-color:var(--sand); }
  /* 本文：コンセプトカラーに合わせる */
  .card { border-color:var(--line); }
  .ph { background:var(--soft); }
  .ph h2 .ppen { border-color:var(--logo); color:var(--logo); }
  .bnote { margin:6px 0 4px; padding:6px 10px; font-size:12px; }
  .tbl th { background:var(--head); }
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="ttl"><h1>植栽手配　選定チェック</h1><span id="meta">読み込み中…</span></div>
    <span id="who"></span>
    <button id="howto" type="button" aria-label="使い方動画を見る"><span class="play">▶</span><span>使い方<br>動画</span></button>
  </div>
  <div class="bar tools">
    <button id="refresh" class="b-refresh" type="button" disabled>↻ 更新</button>
    <button id="login" class="b-add" type="button">ログインしてチェック</button>
    <button id="addProp" class="b-add" type="button" style="display:none">＋ 物件</button>
    <div class="seg" role="group" aria-label="表示の形">
      <button type="button" data-view="card">カード</button><button type="button" data-view="table">一覧表</button>
    </div>
    <select id="view" hidden aria-hidden="true"><option value="card">カード</option><option value="table">一覧表</option></select>
    <span id="shownCount"></span>
  </div>
  <div class="bar filters">
    <select id="range" aria-label="期間で絞り込み">
      <option value="all">期間</option>
      <optgroup label="準備日が">
        <option value="prep0">準備今日</option>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, updateDoc, deleteField, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { firebaseConfig } from "../assets/js/firebase-config.js";

/*
 * 植栽の選定チェック。
 * リストは会社のPCが「植栽依頼一括管理表」と各邸の「植栽依頼ｼｰﾄ」から作り、Firebase に置く。
 * この画面はそれを表示し、チェックと「品目の手直し」を書き込む。
 *
 * 手直し（edits）は PC が作るリストとは別の欄に置く。「更新」で作り直しても消えないようにするため。
 *   edits.{品目ID} = { name, height, qty, unit, deleted, by, atISO }   … 元からある品目の修正・削除
 *   edits.{a…}     = { prop, name, height, qty, unit, by, atISO }      … 画面で追加した品目（prop＝邸のID）
 *   props.{邸のID}  = { name, work, prep, contractor, deleted, by, atISO } … 邸の修正・削除
 *   props.{p…}      = { added:true, name, work, prep, contractor, by, atISO } … 画面で追加した邸（work/prep は YYYY-MM-DD）
 *
 * 見る：URL の ?b=（ボードのID）を知っている人なら誰でも（渡邉樹苗園さんもログインなしで見られる）
 * 書く：会社の Google アカウント（@archigarden.net）でログインした人だけ。守りは firestore.rules にある
 * お客様名などはコードに書かない（公開リポジトリのため）。すべて Firebase から読む。
 */
const $ = (id) => document.getElementById(id);
const boardId = new URLSearchParams(location.search).get("b");
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ref = () => doc(db, "shokusaiBoards", boardId);
let board = null, user = null;
/**
 * 編集中の邸の下書き。{ id（追加なら "new"）, p, prop:{物件の欄}, items:[木ごとの欄] }
 * 入力中に他の人の変更で画面が描き直されて消えないよう、その間は描き直しを待たせる
 */
let draft = null, pending = false;

const STAFF = /@archigarden\.net$/i;
const canWrite = () => !!(user && user.email && STAFF.test(user.email));
const shortName = (u) => (u.displayName || u.email || "").split(/[\s@]/)[0];
const hhmm = (iso) => { if (!iso) return ""; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const stamp = () => ({ by: shortName(user), atISO: new Date().toISOString() });

if (!boardId) {
  $("meta").textContent = "リンクが正しくありません。";
  $("guide").innerHTML = '<span class="err">渡されたリンクをそのまま開いてください（最後に「?b=…」が付いたもの）。</span>';
} else {
  onSnapshot(ref(), (snap) => {
    if (!snap.exists()) { $("meta").textContent = "このリンクのリストは見つかりません。"; return; }
    board = snap.data();
    if (draft) pending = true; else render();
  }, (e) => { $("meta").textContent = "読み込めませんでした：" + e.code; });
}

onAuthStateChanged(auth, (u) => {
  user = u;
  $("login").style.display = u ? "none" : "inline-block";
  $("who").innerHTML = "";
  if (u) {
    const s = document.createElement("span");
    s.textContent = (canWrite() ? "" : "（チェックできないアカウント）") + shortName(u) + " ";
    const out = document.createElement("a"); out.href = "#"; out.textContent = "ログアウト"; out.style.color = "#fff";
    out.onclick = (e) => { e.preventDefault(); signOut(auth); };
    $("who").append(s, out);
  }
  render();
});
$("login").onclick = async () => {
  const p = new GoogleAuthProvider();
  p.setCustomParameters({ hd: "archigarden.net", prompt: "select_account" });
  try { await signInWithPopup(auth, p); } catch (e) { if (e.code !== "auth/popup-closed-by-user") alert("ログインできませんでした：" + e.code); }
};
$("refresh").onclick = async () => {
  if (!canWrite()) return;
  $("refresh").disabled = true;
  try { await updateDoc(ref(), { updateRequest: { atISO: new Date().toISOString(), by: shortName(user) } }); }
  catch (e) { alert("更新を頼めませんでした：" + e.code); $("refresh").disabled = false; }
};
// ---- ブラウザで開く注意書き・使い方動画 ----
// 説明の資料にも同じボードのIDを渡し、そこから戻れるようにする
$("browserHelp").href = "browser.html" + (boardId ? "?b=" + encodeURIComponent(boardId) : "");
// LINE WORKS・LINE などのアプリの中の画面で開いているときは、注意書きを強める
if (/WORKSMOBILE|LINEWORKS|\bLine\/|FBAN|FBAV|Instagram|; wv\)/i.test(navigator.userAgent)) {
  $("browserNote").classList.add("inapp");
  $("browserNote").querySelector("b").textContent = "⚠ いまアプリの中の画面で開いています。Safari・Chrome などのブラウザで開き直してください。";
}
$("howto").onclick = () => { $("videoBox").hidden = false; $("guideVideo").play().catch(() => {}); };
const closeVideo = () => { $("guideVideo").pause(); $("videoBox").hidden = true; };
$("videoClose").onclick = closeVideo;
$("videoBox").onclick = (e) => { if (e.target === $("videoBox")) closeVideo(); };

try { const v = localStorage.getItem("shokusai_view"); if (v) $("view").value = v; } catch {}
// 見える切り替えボタンは、隠した select（#view）を動かす
for (const b of document.querySelectorAll(".seg button")) {
  b.onclick = () => { $("view").value = b.dataset.view; $("view").dispatchEvent(new Event("change")); };
}
for (const id of ["range", "contractor", "view"]) {
  $(id).onchange = () => { try { localStorage.setItem("shokusai_" + id, $(id).value); } catch {} render(); };
}
try { const v = localStorage.getItem("shokusai_range"); if (v) $("range").value = v; } catch {}

// ---- 日付（今日から何日か）----
const pad2 = (n) => String(n).padStart(2, "0");
const todayKey = () => { const t = new Date(); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`; };
const keyToDate = (k) => new Date(Number(k.slice(0, 4)), Number(k.slice(5, 7)) - 1, Number(k.slice(8, 10)));
/** 今日から何日後か（日まで分からないものは null） */
const daysFrom = (k) => (dateOf(k) ? Math.round((keyToDate(k) - keyToDate(todayKey())) / 864e5) : null);
const WD = "日月火水木金土";
const wd = (k) => (dateOf(k) ? `(${WD[keyToDate(k).getDay()]})` : "");
/** 「YYYY-MM-DD」の前日 */
const dayBefore = (k) => { if (!dateOf(k)) return ""; const d = keyToDate(k); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
function relText(n) {
  if (n == null) return "";
  if (n < 0) return `${-n}日過ぎ`;
  if (n === 0) return "今日";
  if (n === 1) return "明日";
  return `あと${n}日`;
}
/** 「準備 11/23(月) あと6日」の札 */
function dateChip(label, text, key, warnDays) {
  const n = daysFrom(key);
  const c = el("span", "d" + (n != null && n < 0 ? " late" : n != null && n <= warnDays ? " soon" : ""));
  c.append(label + " ");
  c.append(el("b", "", text + wd(key)));
  if (n != null) c.append(el("em", "", relText(n)));
  return c;
}
/** 絞り込み */
function passRange(p) {
  const v = $("range").value;
  if (v === "all") return true;
  if (v.startsWith("prep")) { const n = daysFrom(p.prepSort); return n != null && n <= Number(v.slice(4)); }
  if (v === "work7") { const n = daysFrom(p.workSort); return n != null && n >= 0 && n <= 7; }
  const t = new Date(); const m = v === "workThis" ? t.getMonth() : t.getMonth() + 1;
  const y = t.getFullYear() + (m > 11 ? 1 : 0);
  return (p.workSort || "").slice(0, 7) === `${y}-${pad2((m % 12) + 1)}`;
}

$("hideDone").onchange = () => { try { localStorage.setItem("shokusai_hideDone", $("hideDone").checked ? "1" : ""); } catch {} render(); };
try { $("hideDone").checked = !!localStorage.getItem("shokusai_hideDone"); } catch {}
$("sort").onchange = () => { try { localStorage.setItem("shokusai_sort", $("sort").value); } catch {} render(); };
try { const v = localStorage.getItem("shokusai_sort"); if (v) $("sort").value = v; } catch {}
$("addProp").onclick = () => { if (draft && !confirm("編集中の物件があります。保存せずに切り替えますか？")) return; startEdit(null); window.scrollTo(0, 0); };

/** 「2026-11-20」→「11/20」 */
const mdLabel = (s) => { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(s || ""); return m ? `${+m[1]}/${+m[2]}` : "未定"; };
/** 「11/20」→ 並び替え用の「YYYY-MM-DD」（年は施工日から推す。無ければ今年か来年の近い方） */
function sortKeyOf(label, hint) {
  const m = /^(\d+)\/(\d+)$/.exec(label || "");
  if (!m) return "9999-99-99";
  let y = Number((hint || "").slice(0, 4)) || new Date().getFullYear();
  if (!hint) { const now = new Date(); if (Number(m[1]) < now.getMonth() + 1 - 3) y++; }
  return `${y}-${String(m[1]).padStart(2, "0")}-${String(m[2]).padStart(2, "0")}`;
}
/** 日付欄に入れられる形（日まで分かるもの）だけを返す */
const dateOf = (k) => (/^\d{4}-\d{2}-(0[1-9]|[12]\d|3[01])$/.test(k || "") ? k : "");

/** PC が作った邸に手直しを重ね、画面で追加した邸を足す */
function propsOf() {
  const props = board.props || {};
  const shown = [], gone = [];
  for (const p of board.properties || []) {
    const e = props[p.id];
    const q = { ...p, prepSort: p.prepSort || sortKeyOf(p.prepLabel, p.workSort !== "9999-99-99" ? p.workSort : "") };
    // 住所は、管理表の「地図」欄から PC が作った Google マップのリンク（mapUrl）を初めから入れておく
    q.address = p.mapUrl || "";
    q.orig = { ...q };
    if (e && !e.deleted) {
      Object.assign(q, { name: e.name || p.name, contractor: e.contractor ?? p.contractor, address: e.address ?? q.address, drawUrl: e.drawUrl || "", drawFile: e.drawFile || null, e });
      if (e.work) Object.assign(q, { workLabel: mdLabel(e.work), workSort: e.work });
      if (e.prep) Object.assign(q, { prepLabel: mdLabel(e.prep), prepSort: e.prep });
    }
    (e?.deleted ? gone : shown).push(e?.deleted ? { ...q, e } : q);
  }
  for (const [id, e] of Object.entries(props)) {
    if (!e?.added) continue;
    const q = { id, name: e.name, contractor: e.contractor || "", address: e.address || "", drawUrl: e.drawUrl || "", drawFile: e.drawFile || null, items: [], source: "画面", folderFound: true, added: true, e,
      workLabel: mdLabel(e.work), workSort: e.work || "9999-99-99", prepLabel: mdLabel(e.prep), prepSort: e.prep || e.work || "9999-99-99" };
    (e.deleted ? gone : shown).push(q);
  }
  return { shown, gone };
}

async function save(patch) {
  try { await updateDoc(ref(), patch); return true; }
  catch (e) { alert("保存できませんでした：" + e.code); return false; }
}
const setCheck = (id, done) => save({ ["checks." + id]: { done, ...stamp() } }).then((ok) => ok || render());

/** 数量と単位。以前のリストは「2本」のように1つの欄に入っているので分けて読む */
function splitQty(it) {
  if (it.unit != null) return { qty: String(it.qty ?? ""), unit: String(it.unit ?? "") };
  const m = /^(\d+(?:\.\d+)?)\s*(.*)$/.exec(String(it.qty || ""));
  return m ? { qty: m[1], unit: m[2] } : { qty: "", unit: "" };
}
/** 高さの入力をそろえる（「2.5」→「H2.5」、空→「指定なし」） */
function normHeight(v) {
  const s = String(v || "").normalize("NFKC").trim();
  if (!s) return "指定なし";
  if (/^\d+(\.\d+)?$/.test(s)) return "H" + Number(s).toFixed(1);
  if (/^h\s*\d/i.test(s)) return "H" + Number(s.replace(/^h\s*/i, "")).toFixed(1);
  return s;
}
const fmtHeight = (h) => h || "指定なし";
const qtyText = (o) => (o.qty ? o.qty + (o.unit || "") : "数量未確認");

/** 邸ごとに、PC が作った品目に手直しを重ね、画面で追加した品目を足す */
function itemsOf(p, edits) {
  const shown = [], gone = [];
  for (const it of p.items || []) {
    const base = { ...it, ...splitQty(it) };
    const e = edits[it.id];
    if (e?.deleted) { gone.push({ ...base, id: it.id, e, orig: base }); continue; }
    shown.push(e ? { ...base, name: e.name, height: e.height, qty: e.qty, unit: e.unit, form: e.form ?? base.form, id: it.id, orig: base, e } : { ...base, id: it.id, orig: base });
  }
  // 画面で追加した木は、追加した順に並べる（保存先の並びは順不同のため）
  const adds = Object.entries(edits).filter(([, e]) => e?.prop === p.id)
    .sort(([, a], [, b]) => String(a.created || a.atISO).localeCompare(String(b.created || b.atISO)));
  for (const [id, e] of adds) {
    const a = { id, name: e.name, height: e.height, qty: e.qty, unit: e.unit, form: e.form || "", added: true, e };
    (e.deleted ? gone : shown).push(a);
  }
  return { shown, gone };
}

// ---- 編集（物件ごとに1つのボタンで、物件の情報とその邸の木をまとめて直す）----
const hIn = (h) => (h && h !== "指定なし" ? String(h).replace(/^H/, "") : "");
const newItem = () => ({ id: null, added: true, name: "", height: "", qty: "", unit: "本", form: "", deleted: false });
function startEdit(p, shown, gone) {
  draft = {
    id: p ? p.id : "new", p,
    prop: { name: p?.name || "", work: dateOf(p?.workSort), prep: dateOf(p?.prepSort), contractor: p?.contractor || "",
      address: p?.address || "", drawUrl: p?.drawUrl || "", drawFile: p?.drawFile || null },
    items: p
      ? [...shown, ...gone.map((g) => ({ ...g, gone: true }))].map((it) => ({
          id: it.id, added: !!it.added, e: it.e, base: it.added ? null : it.orig,
          name: it.name, height: hIn(it.height), qty: it.qty || "", unit: it.unit || "", form: kabuKey(it.form) ? kabuLabel(it.form) : (it.form || ""), deleted: !!it.gone }))
      : [newItem()],
  };
  render();
  if (p) focusProp(p.id);
}
const same = (a, b) => ["name", "height", "qty", "unit"].every((k) => String(a[k] ?? "") === String(b[k] ?? ""))
  && kabuNorm(a.form) === kabuNorm(b.form);
const rnd = () => Math.random().toString(36).slice(2, 12);

/** 下書きと今の中身を比べて、変わったところだけを1回で書き込む */
async function saveDraft(btn) {
  const d = draft, P = d.prop, st = stamp(), patch = {};
  if (d.uploading) { alert("図面のPDFを保存しています。終わってから押してください。"); return; }
  const pv = { name: P.name.normalize("NFKC").trim().slice(0, 60), work: P.work, prep: P.prep || dayBefore(P.work), contractor: P.contractor.trim().slice(0, 30),
    address: P.address.normalize("NFKC").trim().slice(0, 500), drawUrl: P.drawUrl.trim().slice(0, 500), drawFile: P.drawFile || null };
  if (!pv.name) { alert("物件名を入れてください。"); return; }
  if (/^http:\/\//i.test(pv.address)) { alert("住所のリンクは https:// で始まるものを貼ってください。"); return; }
  if (pv.drawUrl && !/^https:\/\//i.test(pv.drawUrl)) { alert("図面のリンクは https:// で始まるものを貼ってください。"); return; }
  const pid = d.id === "new" ? "p" + rnd() : d.id;
  const eq = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
  if (d.id === "new") patch["props." + pid] = { added: true, ...pv, deleted: false, ...st };
  else {
    const cur = { name: d.p.name, work: dateOf(d.p.workSort), prep: dateOf(d.p.prepSort), contractor: d.p.contractor || "",
      address: d.p.address || "", drawUrl: d.p.drawUrl || "", drawFile: d.p.drawFile || null };
    const changed = Object.keys(pv).some((k) => !eq(pv[k], cur[k]));
    if (changed && d.p.added) patch["props." + pid] = { ...d.p.e, ...pv, deleted: false, ...st };
    else if (changed) {
      const o = d.p.orig;
      const orig = { name: o.name, work: dateOf(o.workSort), prep: dateOf(o.prepSort), contractor: o.contractor || "", address: o.address || "", drawUrl: "", drawFile: null };
      // 管理表どおりに戻したなら、手直しごと消す
      patch["props." + pid] = Object.keys(pv).every((k) => eq(pv[k], orig[k])) ? deleteField() : { ...pv, deleted: false, ...st };
    }
  }
  for (const it of d.items) {
    const v = { name: it.name.normalize("NFKC").trim().slice(0, 60), height: normHeight(it.height).slice(0, 20),
      qty: it.qty.normalize("NFKC").trim().slice(0, 10), unit: it.unit.normalize("NFKC").trim().slice(0, 10), form: String(it.form || "").slice(0, 20) };
    if (it.added && !it.id) { if (v.name && !it.deleted) patch["edits.a" + rnd()] = { prop: pid, ...v, ...st, created: new Date(Date.now() + d.items.indexOf(it)).toISOString() }; continue; }
    if (it.added) {
      if (!v.name) v.name = it.e.name;
      if (same(v, it.e) && !!it.e.deleted === it.deleted) continue;
      patch["edits." + it.id] = { ...it.e, ...v, deleted: it.deleted, ...st };
      continue;
    }
    const b = { name: it.base.name, height: it.base.height || "指定なし", qty: it.base.qty || "", unit: it.base.unit || "", form: it.base.form || "" };
    if (!v.name) v.name = b.name;
    // 依頼シートどおりに戻したなら、手直しごと消す
    if (same(v, b) && !it.deleted) { if (it.e) patch["edits." + it.id] = deleteField(); continue; }
    if (it.e && same(v, it.e) && !!it.e.deleted === it.deleted) continue;
    patch["edits." + it.id] = { ...v, deleted: it.deleted, ...st };
  }
  if (!Object.keys(patch).length) { draft = null; render(); focusProp(pid); return; }
  btn.disabled = true;
  if (await save(patch)) { draft = null; render(); focusProp(pid); } else btn.disabled = false;
}

// ---- 外構図面の PDF ----
// 別の保管サービスを使わず、Firestore の shokusaiFiles に 700KB ずつ分けて置く（1文書の上限が1MBのため）。
// 文書のIDは推測できない長さの乱数。見る人はボードと同じく「IDを知っている人」だけ
const CHUNK = 700 * 1024, MAX_FILE = 15 * 1024 * 1024;
function toB64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
async function uploadPdf(file, onProgress) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const id = [...crypto.getRandomValues(new Uint8Array(14))].map((x) => x.toString(16).padStart(2, "0")).join("");
  const of = Math.ceil(buf.length / CHUNK) || 1;
  for (let n = 0; n < of; n++) {
    await setDoc(doc(db, "shokusaiFiles", `${id}_${n}`), { b64: toB64(buf.subarray(n * CHUNK, (n + 1) * CHUNK)), n, of, ...stamp() });
    onProgress?.(n + 1, of);
  }
  return { id, of, name: file.name.slice(0, 80), size: buf.length };
}
async function openFile(f, btn) {
  // 先に窓を開けておく（読み込みの後に開くと、携帯ではポップアップとして止められるため）
  const w = window.open("", "_blank");
  const label = btn.textContent; btn.textContent = "📄 読み込み中…"; btn.disabled = true;
  try {
    const parts = [];
    for (let n = 0; n < f.of; n++) {
      const s = await getDoc(doc(db, "shokusaiFiles", `${f.id}_${n}`));
      if (!s.exists()) throw new Error("図面の一部が見つかりません");
      const bin = atob(s.data().b64); const u = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      parts.push(u);
    }
    const url = URL.createObjectURL(new Blob(parts, { type: "application/pdf" }));
    if (w) w.location.href = url; else location.href = url;
  } catch (e) { w?.close(); alert("図面を開けませんでした：" + (e.message || e)); }
  finally { btn.textContent = label; btn.disabled = false; }
}
/** PDF を置く枠（ドラッグ＆ドロップ、または押して選ぶ） */
function dropZone(d) {
  const z = el("div", "drop");
  const pick = document.createElement("input"); pick.type = "file"; pick.accept = "application/pdf,.pdf"; pick.hidden = true;
  const show = (msg) => {
    z.innerHTML = ""; z.append(pick);
    if (msg) { z.append(el("div", "dmsg", msg)); return; }
    if (d.prop.drawFile) {
      z.append(el("div", "dmsg", `📄 ${d.prop.drawFile.name}（${(d.prop.drawFile.size / 1048576).toFixed(1)}MB）`));
      const x = el("button", "lnk", "外す"); x.type = "button";
      x.onclick = (e) => { e.stopPropagation(); d.prop.drawFile = null; show(); };
      z.append(x);
      z.append(el("div", "dsub", "差し替えるときは、別のPDFをここに置くか押して選ぶ"));
    } else {
      z.append(el("div", "dmsg", "外構図面のPDFをここにドラッグ＆ドロップ"));
      z.append(el("div", "dsub", "または押してファイルを選ぶ（15MBまで）"));
    }
  };
  const take = async (file) => {
    if (!file) return;
    if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { alert("PDFのファイルを選んでください。"); return; }
    if (file.size > MAX_FILE) { alert("15MBまでのPDFにしてください。"); return; }
    d.uploading = true; show("保存しています…");
    try { d.prop.drawFile = await uploadPdf(file, (i, n) => show(`保存しています…（${i}/${n}）`)); show(); }
    catch (e) { alert("図面を保存できませんでした：" + (e.code || e.message || e)); show(); }
    finally { d.uploading = false; }
  };
  z.onclick = () => { if (!d.uploading) pick.click(); };
  pick.onchange = () => take(pick.files[0]);
  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = (e) => { e.preventDefault(); z.classList.remove("over"); if (!d.uploading) take(e.dataTransfer.files[0]); };
  show();
  return z;
}

function render() {

  }
  const { shown: propsShown, gone: propsGone } = propsOf();
  const rows = propsShown.map((p) => {
    const r = itemsOf(p, edits);
    return { p, ...r, doneN: r.shown.filter((i) => checks[i.id]?.done).length };
  });
  // 業者の選択肢は、今の一覧にいる業者から作る

    : by === "todo" ? (b.shown.length - b.doneN) - (a.shown.length - a.doneN) || cmp(a.p.prepSort, b.p.prepSort)

/** 編集を始めた・終えた邸を、画面の一番上（見出しのすぐ下）に持ってくる */
let focusPid = null, focusUntil = 0;
function focusProp(id) { focusPid = id; focusUntil = Date.now() + 2500; scrollToFocus(); }
// 自分で画面を動かしたら、追いかけるのをやめる
for (const ev of ["wheel", "touchstart", "keydown"]) addEventListener(ev, () => { focusPid = null; }, { passive: true });
function scrollToFocus() {
  if (!focusPid || Date.now() > focusUntil) { focusPid = null; return; }
  requestAnimationFrame(() => {
    const c = [...document.querySelectorAll(".card")].find((x) => x.dataset.pid === focusPid);
    if (!c) return;
    const head = document.querySelector("header").offsetHeight;
    window.scrollTo({ top: c.getBoundingClientRect().top + window.scrollY - head - 6, behavior: "auto" });
  });
}

/**

function buildTable(rows) {
  const wrap = el("div", "tblwrap");

  for (const h of ["物件名", "準備", "施工", "選定済", "業者", "配送", "渡邉樹苗園 様", "地図", "図面", "備考"]) head.append(el("th", "", h));
  const thead = el("thead"); thead.append(head); t.append(thead);

    const tr = el("tr", all ? "alldone" : "");

    nameTd.append(a);
    if (p.added) nameTd.append(el("span", "addtag", "追加"));
    tr.append(nameTd);
    const dateTd = (label, key, warnDays) => {
      const td = el("td", "dt"); const n = daysFrom(key);
      td.className = "dt" + (n != null && n < 0 ? " late" : n != null && n <= warnDays ? " soon" : "");
      td.append(el("b", "", label + wd(key)));
      if (n != null) td.append(el("small", "", relText(n)));
      return td;
    };
    // 携帯で横に動かさなくても分かるよう、日付と選定の進み具合を先に置く
    tr.append(dateTd(p.prepLabel, p.prepSort, 2), dateTd(p.workLabel, p.workSort, 1), el("td", "num" + (all ? " ok" : ""), `${doneN}/${shown.length}`));
    tr.append(el("td", "", honor(p.contractor)));
    tr.append(el("td", "", p.delivery || ""), el("td", "", p.watanabe ? "手配" + p.watanabe : ""));
    const mapTd = el("td", "");
    if (p.address) {
      const isLink = /^https:\/\//i.test(p.address);
      if (isLink || !/^[a-z]+:/i.test(p.address)) {
        const m = el("a", "", "📍地図"); m.target = "_blank"; m.rel = "noopener noreferrer";
        m.href = isLink ? p.address : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.address);
        tip(m, isLink ? "Googleマップで開く" : "Googleマップで探す", p.address);
        mapTd.append(m);
      }
    }
    tr.append(mapTd);
    const drawTd = el("td", "");
    if (/^https:\/\//i.test(p.drawUrl || "")) { const d = el("a", "", "📄リンク"); d.href = p.drawUrl; d.target = "_blank"; d.rel = "noopener noreferrer"; tip(d, "外構図面を開く（リンク）", p.drawUrl); drawTd.append(d); }
    if (p.drawFile) { const b = el("button", "lnk", "📄PDF"); b.type = "button"; b.onclick = () => openFile(p.drawFile, b); tip(b, "外構図面を開く（PDF）", p.drawFile.name); drawTd.append(b); }
    const nt = el("td", "nt", p.note || ""); if (p.note) nt.title = p.note;
    tr.append(drawTd, nt);
    tb.append(tr);
  }
  t.append(tb); wrap.append(t);
  return wrap;
}

/**
 * 株立ちの選択肢。植栽依頼ｼｰﾄ（Excel）の「形」の欄の入力規則と同じ4つ：
 *   単木／株２～3本立／株４～5本立／株6本～7本
 * Excel の書き方はゆれる（全角・「株6本～7本」など）ので、本数で見分ける。
 */
const KABU = [
  { key: "1", label: "単木", trunks: 1, note: "幹が1本" },
  { key: "2-3", label: "株2~3本立", trunks: 3, note: "根元から2〜3本" },
  { key: "4-5", label: "株4~5本立", trunks: 5, note: "根元から4〜5本" },
  { key: "6-7", label: "株6~7本立", trunks: 7, note: "根元から6〜7本" },
];
function kabuKey(v) {
  const s = String(v || "").normalize("NFKC");
  if (/単木|単幹/.test(s)) return "1";
  const m = /(\d+)\D{0,3}[~〜～-]\D{0,3}(\d+)/.exec(s);
  if (m) { const a = Number(m[1]); return a <= 3 ? "2-3" : a <= 5 ? "4-5" : "6-7"; }
  return "";
}
const kabuLabel = (v) => KABU.find((k) => k.key === kabuKey(v))?.label || "";
const kabuNorm = (v) => kabuKey(v) || String(v || "").normalize("NFKC").trim();
/** 見本写真：植栽依頼ｼｰﾄの「樹形　発注依頼時のイメージ写真」と同じ切り抜き（img/kabu*.jpg） */
const kabuPhoto = (key) => key ? `img/kabu${key}.jpg` : "";
/** 編集で株立ちを選ぶ（ドロップダウン＋選んだ形の見本写真。写真を押すと大きく出る）。
 *  入力欄の1行に並べるので、[欄, 写真] の2つを返す */
function kabuPicker(it) {
  const sel = el("select");
  const opts = [["", "指定なし"], ...KABU.map((k) => [k.label, k.label.replace(/立$/, "")])];
  const cur = kabuKey(it.form);
  if (it.form && !cur) opts.push([it.form, it.form]); // 4つ以外の書き方はそのまま残す
  for (const [v, t] of opts) { const o = el("option", "", t); o.value = v; sel.append(o); }
  sel.value = cur ? kabuLabel(it.form) : (it.form || "");
  const img = el("img", "kabu-ph"); img.alt = "株立ちの見本写真"; img.title = "押すと大きく表示";
  img.onclick = () => kabuBig(sel.value);
  const cell = el("div", "kabu-ph-sp"); cell.append(img);
  const show = () => { const k = kabuKey(sel.value); img.hidden = !k; if (k) img.src = kabuPhoto(k); };
  sel.onchange = () => { it.form = sel.value; show(); };
  show();
  return [lab("株立ち", sel), cell];
}
/** 見本写真を画面の真ん中に大きく出す（どこを押しても閉じる） */
function kabuBig(form) {
  const k = kabuKey(form); if (!k) return;
  const w = el("div"); w.id = "kabuBig";
  const im = el("img"); im.src = kabuPhoto(k); im.alt = "株立ちの見本写真";
  const cap = el("div", "", kabuLabel(form) + "（依頼シートの見本）");
  cap.append(el("small", "", "画面を押すと閉じます"));
  w.append(im, cap);
  w.onclick = () => w.remove();
  document.body.append(w);
}

/** 業者名は敬意を込めて必ず「様」を付けて表示する（データはそのまま。未定のときは付けない） */
function honor(c) {
  const s = String(c || "").trim();
  if (!s || s === "業者未定") return "業者未定";
  return /様$/.test(s) ? s : s + " 様";
}
/** カーソルを合わせたときに、何が開くか（リンク先・ファイル名）を出す */
function tip(target, head, detail) {
  let t = document.getElementById("tip");
  if (!t) { t = el("div"); t.id = "tip"; document.body.append(t); }
  target.setAttribute("aria-label", `${head}：${detail}`);
  target.addEventListener("mouseenter", () => {
    t.innerHTML = ""; t.append(el("b", "", head), el("span", "", detail));
    t.style.display = "block";
    const r = target.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
    t.style.left = Math.max(12, Math.min(r.left, innerWidth - w - 12)) + "px";
    t.style.top = (r.bottom + 6 + h > innerHeight ? r.top - h - 6 : r.bottom + 6) + "px";
  });
  target.addEventListener("mouseleave", () => { t.style.display = "none"; });
}
addEventListener("scroll", () => { const t = document.getElementById("tip"); if (t) t.style.display = "none"; }, { passive: true });
function input(cls, value, ph) { const i = document.createElement("input"); if (cls) i.className = cls; i.value = value; i.placeholder = ph; return i; }
function lab(text, inp) { const l = el("label", "", text); l.append(inp); return l; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
